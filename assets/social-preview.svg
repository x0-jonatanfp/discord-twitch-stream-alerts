<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="social-title social-desc">
  <title id="social-title">Discord Twitch Stream Alerts</title>
  <desc id="social-desc">Multi-guild Twitch live notifications for Discord</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#17101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9146ff"/>
      <stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#9146ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9146ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="10" height="640" fill="url(#accent)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="80" y="150" fill="#a970ff" font-size="16" font-weight="700" letter-spacing="5">TWITCH → DISCORD</text>
    <text x="80" y="250" fill="#ffffff" font-size="68" font-weight="700" letter-spacing="-1">Discord Twitch</text>
    <text x="80" y="330" fill="#ffffff" font-size="68" font-weight="700" letter-spacing="-1">Stream Alerts</text>
    <text x="80" y="390" fill="#c9c3d6" font-size="24">Multi-guild live notifications</text>
    <text x="80" y="424" fill="#c9c3d6" font-size="24">EventSub + Helix · TypeScript</text>
    <g font-size="16">
      <rect x="80" y="470" width="128" height="34" rx="17" fill="#1d1529" stroke="#3a2a52"/>
      <text x="144" y="492" text-anchor="middle" fill="#d8ccef">TypeScript</text>
      <rect x="220" y="470" width="120" height="34" rx="17" fill="#1d1529" stroke="#3a2a52"/>
      <text x="280" y="492" text-anchor="middle" fill="#d8ccef">Node 22+</text>
      <rect x="352" y="470" width="116" height="34" rx="17" fill="#1d1529" stroke="#3a2a52"/>
      <text x="410" y="492" text-anchor="middle" fill="#d8ccef">EventSub</text>
      <rect x="480" y="470" width="90" height="34" rx="17" fill="#1d1529" stroke="#3a2a52"/>
      <text x="525" y="492" text-anchor="middle" fill="#d8ccef">MIT</text>
    </g>
    <text x="80" y="590" fill="#8d869c" font-size="18">github.com/x0-jonatanfp/discord-twitch-stream-alerts</text>
  </g>
  <g>
    <rect x="850" y="200" width="140" height="140" rx="34" fill="#9146ff"/>
    <path d="M894 242 L894 298 L934 270 Z" fill="#ffffff"/>
    <text x="920" y="392" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#c9c3d6">Twitch</text>
    <line x1="1000" y1="270" x2="1058" y2="270" stroke="#4b4458" stroke-width="4" stroke-linecap="round"/>
    <path d="M1048 258 L1060 270 L1048 282" fill="none" stroke="#4b4458" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1030" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a970ff">EventSub</text>
    <rect x="1070" y="200" width="140" height="140" rx="34" fill="#5865f2"/>
    <rect x="1106" y="240" width="72" height="52" rx="14" fill="#ffffff"/>
    <path d="M1116 288 L1110 306 L1132 288 Z" fill="#ffffff"/>
    <circle cx="1124" cy="266" r="3.5" fill="#5865f2"/>
    <circle cx="1142" cy="266" r="3.5" fill="#5865f2"/>
    <circle cx="1160" cy="266" r="3.5" fill="#5865f2"/>
    <text x="1140" y="392" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#c9c3d6">Discord</text>
  </g>
