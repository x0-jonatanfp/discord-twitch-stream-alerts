<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Discord Twitch Stream Alerts</title>
  <desc id="banner-desc">A TypeScript bot that sends Twitch live alerts to multiple Discord guilds</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#17101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9146ff"/>
      <stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#9146ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9146ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="72" y="86" fill="#a970ff" font-size="13" font-weight="700" letter-spacing="4">TWITCH → DISCORD</text>
    <text x="72" y="136" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="-1">Discord Twitch Stream Alerts</text>
    <text x="72" y="176" fill="#c9c3d6" font-size="20">Multi-guild live notifications · EventSub + Helix · TypeScript</text>
    <g font-size="14">
