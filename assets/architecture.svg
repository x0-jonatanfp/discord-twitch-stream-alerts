<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Runtime architecture</title>
  <desc id="arch-desc">Twitch EventSub and Helix feed a TypeScript bot that posts alerts to multiple Discord guilds and tracks delivery in a JSON state store</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#15101d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9146ff"/>
      <stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#9146ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9146ff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4b4458"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="url(#bg)"/>
  <rect width="1100" height="520" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="520" fill="url(#accent)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="48" y="38" fill="#6f687d" font-size="12" font-weight="700" letter-spacing="3">RUNTIME OVERVIEW</text>
    <text x="48" y="78" fill="#a970ff" font-size="13" font-weight="700" letter-spacing="3">TWITCH</text>
    <text x="400" y="78" fill="#c9c3d6" font-size="13" font-weight="700" letter-spacing="3">BOT</text>
    <text x="790" y="78" fill="#8ea1e1" font-size="13" font-weight="700" letter-spacing="3">DISCORD</text>

    <rect x="48" y="100" width="260" height="92" rx="14" fill="#17131f" stroke="#3a2a52"/>
    <rect x="58" y="116" width="4" height="60" rx="2" fill="#9146ff"/>
    <text x="76" y="138" fill="#ffffff" font-size="20" font-weight="700">EventSub</text>
    <text x="76" y="162" fill="#a970ff" font-size="14">stream.online</text>
    <text x="76" y="180" fill="#8d869c" font-size="13">near real-time</text>

    <rect x="48" y="246" width="260" height="92" rx="14" fill="#17131f" stroke="#3a2a52"/>
    <rect x="58" y="262" width="4" height="60" rx="2" fill="#7aa2ff"/>
    <text x="76" y="284" fill="#ffffff" font-size="20" font-weight="700">Helix API</text>
    <text x="76" y="308" fill="#7aa2ff" font-size="14">polling every 60 s</text>
    <text x="76" y="326" fill="#8d869c" font-size="13">startup + reconnect</text>

    <rect x="400" y="100" width="300" height="330" rx="18" fill="#14101b" stroke="#3a2a52"/>
    <text x="424" y="136" fill="#ffffff" font-size="16" font-weight="600">TypeScript process</text>

    <rect x="424" y="156" width="252" height="54" rx="10" fill="#1d1727" stroke="#322845"/>
    <text x="440" y="178" fill="#f2f3f5" font-size="15" font-weight="600">EventSub client</text>
    <text x="440" y="196" fill="#9b94aa" font-size="13">keepalive · reconnect</text>

    <rect x="424" y="222" width="252" height="54" rx="10" fill="#1d1727" stroke="#322845"/>
    <text x="440" y="244" fill="#f2f3f5" font-size="15" font-weight="600">Reconciler</text>
    <text x="440" y="262" fill="#9b94aa" font-size="13">Helix events + delivery</text>

    <rect x="424" y="288" width="252" height="54" rx="10" fill="#1d1727" stroke="#322845"/>
    <text x="440" y="310" fill="#f2f3f5" font-size="15" font-weight="600">Subscriber index</text>
    <text x="440" y="328" fill="#9b94aa" font-size="13">channel → guilds</text>

    <rect x="424" y="354" width="252" height="54" rx="10" fill="#1d1727" stroke="#322845"/>
    <text x="440" y="376" fill="#f2f3f5" font-size="15" font-weight="600">State store</text>
    <text x="440" y="394" fill="#9b94aa" font-size="13">data/live-state.json · deliveredTo</text>

    <rect x="790" y="126" width="260" height="90" rx="14" fill="#17131f" stroke="#2f3542"/>
    <rect x="800" y="142" width="4" height="58" rx="2" fill="#5865f2"/>
    <text x="818" y="156" fill="#ffffff" font-size="20" font-weight="700">Guild A</text>
    <text x="818" y="176" fill="#8ea1e1" font-size="14"># alerts</text>
    <text x="818" y="196" fill="#8d869c" font-size="13">embed + @everyone</text>

    <rect x="790" y="266" width="260" height="90" rx="14" fill="#17131f" stroke="#2f3542"/>
    <rect x="800" y="282" width="4" height="58" rx="2" fill="#5865f2"/>
    <text x="818" y="296" fill="#ffffff" font-size="20" font-weight="700">Guild B</text>
    <text x="818" y="316" fill="#8ea1e1" font-size="14"># alerts</text>
    <text x="818" y="336" fill="#8d869c" font-size="13">embed + @everyone</text>

    <line x1="308" y1="146" x2="400" y2="146" stroke="#4b4458" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="354" y="134" text-anchor="middle" fill="#a970ff" font-size="12">near real-time</text>
    <line x1="308" y1="292" x2="400" y2="292" stroke="#4b4458" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="354" y="280" text-anchor="middle" fill="#7aa2ff" font-size="12">reconcile</text>
    <line x1="700" y1="171" x2="790" y2="171" stroke="#4b4458" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="745" y="159" text-anchor="middle" fill="#8ea1e1" font-size="12">deliver</text>
    <line x1="700" y1="311" x2="790" y2="311" stroke="#4b4458" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="745" y="299" text-anchor="middle" fill="#8ea1e1" font-size="12">deliver</text>

    <text x="48" y="490" fill="#8d869c" font-size="13">Twitch channels are monitored once; delivery is tracked per subscriber to avoid duplicates.</text>
  </g>
</svg>
