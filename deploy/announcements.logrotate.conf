# Rotacion del log del bot. Se instala en /etc/logrotate.d/announcements
#
# Va en su propio fichero, como server-status, para no tocar la configuracion
# de los demas servicios. copytruncate porque el bot mantiene el fichero en uso.
/var/log/announcements.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root adm
}
